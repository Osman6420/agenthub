apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agenthub-runtime-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: corporate-secret-store
  target:
    name: agenthub-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: {key: agenthub/production/django-signing-key}
    - secretKey: DATABASE_URL
      remoteRef: {key: agenthub/production/database-url}
    - secretKey: REDIS_URL
      remoteRef: {key: agenthub/production/redis-url}
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef: {key: agenthub/production/metrics-scrape-token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agenthub-ingestion-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: corporate-secret-store
  target:
    name: agenthub-ingestion-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: agenthub/production/database-url}
    - secretKey: REDIS_URL
      remoteRef: {key: agenthub/production/redis-url}
    - secretKey: OBJECT_STORE_CREDENTIAL_REF
      remoteRef: {key: agenthub/production/object-store-credential-ref}
