apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: agenthub-bootstrap-restricted
parameters:
  - {name: APPLICATION_IMAGE, required: true}
  - {name: RELEASE_ID, required: true}
objects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-bootstrap
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: agenthub-bootstrap-${RELEASE_ID}
      labels:
        app.kubernetes.io/name: agenthub-bootstrap
        app.kubernetes.io/part-of: agenthub
        app.kubernetes.io/version: ${RELEASE_ID}
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agenthub-bootstrap
            app.kubernetes.io/part-of: agenthub
        spec:
          restartPolicy: Never
          serviceAccountName: agenthub-bootstrap
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: bootstrap
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -ec]
              args:
                - |
                  python manage.py shell -c '
                  import os
                  from django.contrib.auth import get_user_model
                  username = os.environ["PLATFORM_ACTOR"]
                  user, created = get_user_model().objects.get_or_create(
                      username=username,
                      defaults={"is_active": True, "is_staff": True, "is_superuser": True},
                  )
                  if not created and (not user.is_active or not user.is_superuser):
                      raise SystemExit("existing bootstrap actor is not an active recovery superuser")
                  if created:
                      user.set_password(os.environ["BOOTSTRAP_ADMIN_PASSWORD"])
                      user.save()
                  '
                  MODEL_EXISTS="$(python manage.py shell -c 'from apps.orchestration.models import ModelProfile; import os; print(int(ModelProfile.objects.filter(logical_id=os.environ["MODEL_LOGICAL_ID"], revision=int(os.environ["MODEL_REVISION"])).exists()))')"
                  if [ "$MODEL_EXISTS" = "0" ]; then
                    python manage.py register_model_profile \
                      --actor "$PLATFORM_ACTOR" \
                      --logical-id "$MODEL_LOGICAL_ID" \
                      --revision "$MODEL_REVISION" \
                      --host "$MODEL_HOST" \
                      --port "$MODEL_PORT" \
                      --path "$MODEL_PATH" \
                      --model "$MODEL_NAME" \
                      --secret-ref secret:primary
                  fi
                  EMBEDDING_EXISTS="$(python manage.py shell -c 'from apps.ingestion.models import EmbeddingProfile; import os; print(int(EmbeddingProfile.objects.filter(logical_id=os.environ["EMBEDDING_LOGICAL_ID"], revision=int(os.environ["EMBEDDING_REVISION"])).exists()))')"
                  if [ "$EMBEDDING_EXISTS" = "0" ]; then
                    python manage.py register_embedding_profile \
                      --actor "$PLATFORM_ACTOR" \
                      --logical-id "$EMBEDDING_LOGICAL_ID" \
                      --revision "$EMBEDDING_REVISION" \
                      --host "$EMBEDDING_HOST" \
                      --port "$EMBEDDING_PORT" \
                      --path "$EMBEDDING_PATH" \
                      --model "$EMBEDDING_NAME" \
                      --secret-ref secret:primary \
                      --dimensions "$EMBEDDING_DIMENSIONS" \
                      --index-type "$EMBEDDING_INDEX_TYPE"
                  fi
              envFrom:
                - configMapRef: {name: agenthub-config}
                - configMapRef: {name: agenthub-provider-config}
                - secretRef: {name: agenthub-runtime-secrets}
                - secretRef: {name: agenthub-bootstrap-credentials}
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
                limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
