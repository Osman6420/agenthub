apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: agenthub-restricted
  annotations:
    description: Restricted-SCC-compatible AgentHub application workloads; managed dependencies are external.
parameters:
  - {name: APPLICATION_IMAGE, required: true}
  - {name: STATIC_IMAGE, required: true}
  - {name: RELEASE_ID, required: true}
  - {name: ROUTE_HOST, required: true}
  - {name: NAMESPACE, required: true}
  - {name: OBJECT_STORE_ENDPOINT, required: true}
  - {name: OBJECT_STORE_BUCKET, required: true}
  - {name: OBJECT_STORE_REGION, value: us-east-1}
  - {name: WEB_REPLICAS, value: "2"}
objects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-web
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-runtime
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-ingestion
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-eval
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-beat
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-migrate
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: agenthub-static
      labels: {app.kubernetes.io/part-of: agenthub}
    automountServiceAccountToken: false
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: agenthub-config
      labels: {app.kubernetes.io/part-of: agenthub}
    data:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ALLOWED_HOSTS: ${ROUTE_HOST},agenthub-web,agenthub-web.${NAMESPACE}.svc
      AGENTHUB_STATIC_RELEASE_ID: ${RELEASE_ID}
      DJANGO_STATIC_URL: /static/${RELEASE_ID}/
      DJANGO_SECURE_SSL_REDIRECT: "true"
      RUNTIME_MODEL_PROVIDER: apps.orchestration.providers.OpenAICompatibleModelProvider
      RUNTIME_EMBEDDING_PROVIDER: apps.ingestion.embedding.OpenAICompatibleEmbeddingClient
      RUNTIME_RETRIEVAL_PROVIDER: apps.retrieval.providers.PgvectorRetrievalProvider
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION}
      DOCUMENTS_OBJECT_STORE_BACKEND: s3
      MCP_ENABLED: "false"
      METRICS_ENABLED: "true"
      OTEL_SERVICE_NAME: agenthub
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_ALLOWED_HOSTS: ""
      PYTHON_NODE_RUNTIME_ENABLED: "false"
      TOOL_ADAPTER: deterministic
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-web
      labels: {app.kubernetes.io/name: agenthub-web, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: ${{WEB_REPLICAS}}
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-web}
      strategy:
        type: RollingUpdate
        rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-web, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-web
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: web
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [python, -m, uvicorn]
              args: [config.asgi:application, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
              envFrom:
                - configMapRef: {name: agenthub-config}
                - secretRef: {name: agenthub-web-secrets}
              env:
                - {name: HOME, value: /tmp}
              ports:
                - {name: http, containerPort: 8000}
              startupProbe:
                httpGet: {path: /v1/health/live, port: http}
                periodSeconds: 5
                failureThreshold: 24
                timeoutSeconds: 3
              readinessProbe:
                httpGet: {path: /v1/health/ready, port: http}
                periodSeconds: 10
                failureThreshold: 3
                timeoutSeconds: 3
              livenessProbe:
                httpGet: {path: /v1/health/live, port: http}
                periodSeconds: 20
                failureThreshold: 3
                timeoutSeconds: 3
              resources:
                requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 128Mi}
                limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 512Mi}
              securityContext: &restrictedContainer
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 512Mi}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-worker-runtime
      labels: {app.kubernetes.io/name: agenthub-worker-runtime, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-worker-runtime}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-worker-runtime, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-runtime
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 60
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: worker
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [celery, -A, config.celery, worker]
              args: [-Q, runtime, -l, INFO, --concurrency, "2", --pidfile, /tmp/celery-runtime.pid]
              envFrom:
                - configMapRef: {name: agenthub-config}
                - secretRef: {name: agenthub-runtime-secrets}
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 128Mi}
                limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 512Mi}
              securityContext: *restrictedContainer
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 512Mi}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-worker-ingestion
      labels: {app.kubernetes.io/name: agenthub-worker-ingestion, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-worker-ingestion}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-worker-ingestion, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-ingestion
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 60
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: worker
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [celery, -A, config.celery, worker]
              args: [-Q, ingestion, -l, INFO, --concurrency, "2", --pidfile, /tmp/celery-ingestion.pid]
              envFrom:
                - configMapRef: {name: agenthub-config}
                - secretRef: {name: agenthub-ingestion-secrets}
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi}
                limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi}
              securityContext: *restrictedContainer
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 1Gi}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-worker-eval
      labels: {app.kubernetes.io/name: agenthub-worker-eval, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: 1
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-worker-eval}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-worker-eval, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-eval
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 60
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: worker
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [celery, -A, config.celery, worker]
              args: [-Q, eval, -l, INFO, --concurrency, "1", --pidfile, /tmp/celery-eval.pid]
              envFrom:
                - configMapRef: {name: agenthub-config}
                - secretRef: {name: agenthub-runtime-secrets}
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 200m, memory: 384Mi, ephemeral-storage: 128Mi}
                limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 512Mi}
              securityContext: *restrictedContainer
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 512Mi}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-beat
      labels: {app.kubernetes.io/name: agenthub-beat, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: 1
      strategy: {type: Recreate}
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-beat}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-beat, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-beat
          automountServiceAccountToken: false
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: beat
              image: ${APPLICATION_IMAGE}
              imagePullPolicy: IfNotPresent
              command: [celery, -A, config.celery, beat]
              args: [-l, INFO, --schedule, /tmp/celerybeat-schedule, --pidfile, /tmp/celerybeat.pid]
              envFrom:
                - configMapRef: {name: agenthub-config}
                - secretRef: {name: agenthub-beat-secrets}
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 64Mi}
                limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
              securityContext: *restrictedContainer
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agenthub-static
      labels: {app.kubernetes.io/name: agenthub-static, app.kubernetes.io/part-of: agenthub}
    spec:
      replicas: 2
      selector:
        matchLabels: {app.kubernetes.io/name: agenthub-static}
      strategy:
        type: RollingUpdate
        rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
      template:
        metadata:
          labels: {app.kubernetes.io/name: agenthub-static, app.kubernetes.io/part-of: agenthub}
        spec:
          serviceAccountName: agenthub-static
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: static
              image: ${STATIC_IMAGE}
              imagePullPolicy: IfNotPresent
              ports:
                - {name: http, containerPort: 8080}
              readinessProbe:
                httpGet: {path: /healthz, port: http}
                periodSeconds: 5
                timeoutSeconds: 2
              livenessProbe:
                httpGet: {path: /healthz, port: http}
                periodSeconds: 20
                timeoutSeconds: 2
              resources:
                requests: {cpu: 25m, memory: 32Mi, ephemeral-storage: 16Mi}
                limits: {cpu: 250m, memory: 128Mi, ephemeral-storage: 64Mi}
              securityContext: *restrictedContainer
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
  - apiVersion: v1
    kind: Service
    metadata:
      name: agenthub-web
      labels: {app.kubernetes.io/name: agenthub-web, app.kubernetes.io/part-of: agenthub}
    spec:
      selector: {app.kubernetes.io/name: agenthub-web}
      ports:
        - {name: http, port: 8000, targetPort: http}
  - apiVersion: v1
    kind: Service
    metadata:
      name: agenthub-static
      labels: {app.kubernetes.io/name: agenthub-static, app.kubernetes.io/part-of: agenthub}
    spec:
      selector: {app.kubernetes.io/name: agenthub-static}
      ports:
        - {name: http, port: 8080, targetPort: http}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: agenthub-web
      labels: {app.kubernetes.io/name: agenthub-web, app.kubernetes.io/part-of: agenthub}
    spec:
      host: ${ROUTE_HOST}
      to: {kind: Service, name: agenthub-web}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: agenthub-static
      labels: {app.kubernetes.io/name: agenthub-static, app.kubernetes.io/part-of: agenthub}
    spec:
      host: ${ROUTE_HOST}
      path: /static
      to: {kind: Service, name: agenthub-static}
      port: {targetPort: http}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agenthub-default-deny-ingress
      labels: {app.kubernetes.io/part-of: agenthub}
    spec:
      podSelector:
        matchLabels: {app.kubernetes.io/part-of: agenthub}
      policyTypes: [Ingress]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agenthub-route-ingress
      labels: {app.kubernetes.io/part-of: agenthub}
    spec:
      podSelector:
        matchExpressions:
          - {key: app.kubernetes.io/name, operator: In, values: [agenthub-web, agenthub-static]}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels: {network.openshift.io/policy-group: ingress}
          ports:
            - {protocol: TCP, port: 8000}
            - {protocol: TCP, port: 8080}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agenthub-web-monitoring-ingress
      labels: {app.kubernetes.io/part-of: agenthub}
    spec:
      podSelector:
        matchLabels: {app.kubernetes.io/name: agenthub-web}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels: {openshift.io/cluster-monitoring: "true"}
          ports:
            - {protocol: TCP, port: 8000}
