apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthub.fullname" . }}-web
  labels:
    {{- include "agenthub.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "agenthub.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenthub.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        app.kubernetes.io/part-of: agenthub
      annotations:
        checksum/config: {{ include "agenthub.configData" . | sha256sum }}
        agenthub.io/rollout-nonce: {{ .Values.rolloutNonce | quote }}
    spec:
      serviceAccountName: {{ include "agenthub.fullname" . }}-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "agenthub.podSecurityContext" . | nindent 8 }}
      {{- include "agenthub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "agenthub.applicationImage" . | quote }}
          imagePullPolicy: {{ .Values.images.application.pullPolicy }}
          command: [python, -m, uvicorn]
          args: [config.asgi:application, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
          envFrom:
            - configMapRef: {name: {{ include "agenthub.fullname" . }}-config}
            - secretRef: {name: {{ .Values.existingSecrets.web | quote }}}
          env:
            - {name: HOME, value: /tmp}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /v1/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /v1/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /v1/health/live, port: http}
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "agenthub.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.web.tmpSizeLimit | quote }}}
---
