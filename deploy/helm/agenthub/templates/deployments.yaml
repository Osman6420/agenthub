apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenthub.fullname" . }}-static
  labels:
    {{- include "agenthub.componentLabels" (dict "root" . "component" "static") | nindent 4 }}
spec:
  replicas: {{ .Values.static.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "agenthub.selectorLabels" (dict "root" . "component" "static") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenthub.selectorLabels" (dict "root" . "component" "static") | nindent 8 }}
        app.kubernetes.io/part-of: agenthub
      annotations:
        agenthub.io/rollout-nonce: {{ .Values.rolloutNonce | quote }}
    spec:
      serviceAccountName: {{ include "agenthub.fullname" . }}-static
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "agenthub.podSecurityContext" . | nindent 8 }}
      {{- include "agenthub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: static
          image: {{ include "agenthub.staticImage" . | quote }}
          imagePullPolicy: {{ .Values.images.static.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.static.resources | nindent 12 }}
          securityContext:
            {{- include "agenthub.containerSecurityContext" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.static.tmpSizeLimit | quote }}}
