{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agenthub.fullname" . }}-migrate
  labels:
    {{- include "agenthub.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "agenthub.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
        app.kubernetes.io/part-of: agenthub
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "agenthub.podSecurityContext" . | nindent 8 }}
      {{- include "agenthub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "agenthub.applicationImage" . | quote }}
          imagePullPolicy: {{ .Values.images.application.pullPolicy }}
          command: [python, manage.py, migrate, --noinput]
          envFrom:
            - secretRef: {name: {{ .Values.existingSecrets.migration | quote }}}
          env:
            {{- include "agenthub.hookCommonEnv" . | nindent 12 }}
            - {name: HOME, value: /tmp}
          resources:
            {{- toYaml .Values.hookResources.resources | nindent 12 }}
          securityContext:
            {{- include "agenthub.containerSecurityContext" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.hookResources.tmpSizeLimit | quote }}}
{{- end }}
{{- if .Values.bootstrap.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agenthub.fullname" . }}-bootstrap
  labels:
    {{- include "agenthub.componentLabels" (dict "root" . "component" "bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "agenthub.selectorLabels" (dict "root" . "component" "bootstrap") | nindent 8 }}
        app.kubernetes.io/part-of: agenthub
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "agenthub.podSecurityContext" . | nindent 8 }}
      {{- include "agenthub.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "agenthub.applicationImage" . | quote }}
          imagePullPolicy: {{ .Values.images.application.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              python manage.py shell -c '
              import os
              from django.contrib.auth import get_user_model
              username = os.environ["PLATFORM_ACTOR"]
              user, created = get_user_model().objects.get_or_create(
                  username=username,
                  defaults={"is_active": True, "is_staff": True, "is_superuser": True},
              )
              if not created and (not user.is_active or not user.is_superuser):
                  raise SystemExit("existing bootstrap actor is not an active recovery superuser")
              if created:
                  user.set_password(os.environ["BOOTSTRAP_ADMIN_PASSWORD"])
                  user.save()
              '
              MODEL_EXISTS="$(python manage.py shell -c 'from apps.orchestration.models import ModelProfile; import os; print(int(ModelProfile.objects.filter(logical_id=os.environ["MODEL_LOGICAL_ID"], revision=int(os.environ["MODEL_REVISION"])).exists()))')"
              if [ "$MODEL_EXISTS" = "0" ]; then
                python manage.py register_model_profile \
                  --actor "$PLATFORM_ACTOR" \
                  --logical-id "$MODEL_LOGICAL_ID" \
                  --revision "$MODEL_REVISION" \
                  --host "$MODEL_HOST" \
                  --port "$MODEL_PORT" \
                  --path "$MODEL_PATH" \
                  --model "$MODEL_NAME" \
                  --secret-ref secret:primary
              fi
              EMBEDDING_EXISTS="$(python manage.py shell -c 'from apps.ingestion.models import EmbeddingProfile; import os; print(int(EmbeddingProfile.objects.filter(logical_id=os.environ["EMBEDDING_LOGICAL_ID"], revision=int(os.environ["EMBEDDING_REVISION"])).exists()))')"
              if [ "$EMBEDDING_EXISTS" = "0" ]; then
                python manage.py register_embedding_profile \
                  --actor "$PLATFORM_ACTOR" \
                  --logical-id "$EMBEDDING_LOGICAL_ID" \
                  --revision "$EMBEDDING_REVISION" \
                  --host "$EMBEDDING_HOST" \
                  --port "$EMBEDDING_PORT" \
                  --path "$EMBEDDING_PATH" \
                  --model "$EMBEDDING_NAME" \
                  --secret-ref secret:primary \
                  --dimensions "$EMBEDDING_DIMENSIONS" \
                  --index-type "$EMBEDDING_INDEX_TYPE"
              fi
          envFrom:
            - secretRef: {name: {{ .Values.existingSecrets.runtime | quote }}}
            - secretRef:
                name: {{ .Values.existingSecrets.bootstrap | quote }}
                optional: true
          env:
            {{- include "agenthub.hookCommonEnv" . | nindent 12 }}
            {{- include "agenthub.providerEnv" . | nindent 12 }}
            - {name: HOME, value: /tmp}
          resources:
            {{- toYaml .Values.hookResources.resources | nindent 12 }}
          securityContext:
            {{- include "agenthub.containerSecurityContext" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.hookResources.tmpSizeLimit | quote }}}
{{- end }}
