{{- $root := . -}}
{{- range $component := list "web" "runtime" "ingestion" "eval" "beat" "static" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agenthub.fullname" $root }}-{{ $component }}
  labels:
    {{- include "agenthub.componentLabels" (dict "root" $root "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- with $root.Values.imagePullSecrets }}
imagePullSecrets:
{{- range . }}
  - name: {{ .name | quote }}
{{- end }}
{{- end }}
{{- end }}
