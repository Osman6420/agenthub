{{- $root := . -}}
{{- range $component := list "postgresql" "redis" "minio" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agenthub-stack.fullname" $root }}-{{ $component }}
  labels:
    {{- include "agenthub-stack.componentLabels" (dict "root" $root "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- with $root.Values.imagePullSecrets }}
imagePullSecrets:
{{- range . }}
  - name: {{ .name | quote }}
{{- end }}
{{- end }}
{{- end }}
