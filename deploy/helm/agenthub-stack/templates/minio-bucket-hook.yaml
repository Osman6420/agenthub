apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agenthub-stack.fullname" . }}-minio-bucket
  labels:
    {{- include "agenthub-stack.componentLabels" (dict "root" . "component" "minio-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "agenthub-stack.selectorLabels" (dict "root" . "component" "minio-bootstrap") | nindent 8 }}
        app.kubernetes.io/part-of: agenthub-stack
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "agenthub-stack.podSecurityContext" . | nindent 8 }}
      {{- include "agenthub-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: create-bucket
          image: {{ include "agenthub-stack.image" (dict "name" "minio.client" "image" .Values.minio.clientImage) | quote }}
          imagePullPolicy: {{ .Values.minio.clientImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mc alias set local "http://{{ include "agenthub-stack.fullname" . }}-minio:9000" \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done
              mc mb --ignore-existing "local/$MINIO_BUCKET"
              cat > /tmp/agenthub-policy.json <<EOF
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::$MINIO_BUCKET"]
                  },
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
                    "Resource": ["arn:aws:s3:::$MINIO_BUCKET/*"]
                  }
                ]
              }
              EOF
              mc admin user add local "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null
              mc admin policy create local agenthub-bucket-access /tmp/agenthub-policy.json >/dev/null
              mc admin policy attach local agenthub-bucket-access --user "$AWS_ACCESS_KEY_ID" >/dev/null
          envFrom:
            - secretRef:
                name: {{ .Values.minio.existingSecret | quote }}
          env:
            - { name: MINIO_BUCKET, value: {{ .Values.agenthub.objectStore.bucket | quote }} }
            - { name: HOME, value: /tmp }
          resources:
            {{- toYaml .Values.minio.clientResources | nindent 12 }}
          securityContext:
            {{- include "agenthub-stack.containerSecurityContext" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
