apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agenthub-stack.fullname" . }}-postgres-init
  labels:
    {{- include "agenthub-stack.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
data:
  10-agenthub-init.sh: |
    #!/bin/sh
    set -eu

    psql --set ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set database="$AGENTHUB_DATABASE" \
      --set migration_user="$AGENTHUB_MIGRATION_USER" \
      --set migration_password="$AGENTHUB_MIGRATION_PASSWORD" \
      --set application_user="$AGENTHUB_APPLICATION_USER" \
      --set application_password="$AGENTHUB_APPLICATION_PASSWORD" <<'SQL'
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS',
      :'migration_user', :'migration_password'
    ) WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'migration_user') \gexec
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS',
      :'application_user', :'application_password'
    ) WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'application_user') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'migration_user')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
    SQL

    psql --set ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$AGENTHUB_DATABASE" \
      --set database="$AGENTHUB_DATABASE" \
      --set migration_user="$AGENTHUB_MIGRATION_USER" \
      --set application_user="$AGENTHUB_APPLICATION_USER" <<'SQL'
    CREATE EXTENSION IF NOT EXISTS vector;
    SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'database') \gexec
    SELECT format('GRANT CONNECT, TEMP ON DATABASE %I TO %I', :'database', :'migration_user') \gexec
    SELECT format('GRANT CONNECT, TEMP ON DATABASE %I TO %I', :'database', :'application_user') \gexec
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SELECT format('GRANT USAGE ON SCHEMA public TO %I', :'application_user') \gexec
    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
      :'migration_user', :'application_user'
    ) \gexec
    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I',
      :'migration_user', :'application_user'
    ) \gexec
    SELECT format(
      'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO %I',
      :'migration_user', :'application_user'
    ) \gexec
    SQL
