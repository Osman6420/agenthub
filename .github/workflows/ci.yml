name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, migrations, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify locked dependency tree
        # Fail closed if the resolved tree is internally inconsistent or if the pinned
        # LangGraph version (Sprint 10 agent planner) drifts from requirements.lock.
        run: |
          pip check
          python - <<'PY'
          import importlib.metadata as md

          expected = {}
          with open("requirements.lock", encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line or line.startswith("#") or "==" not in line:
                      continue
                  name, version = line.split("==", 1)
                  expected[name.strip().lower().replace("_", "-")] = version.strip()

          for pkg in ("langgraph", "langgraph-checkpoint", "langchain-core"):
              installed = md.version(pkg)
              assert expected.get(pkg) == installed, (
                  f"{pkg} drift: lock={expected.get(pkg)} installed={installed}"
              )
          print("locked dependency tree verified")
          PY

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Type-check (mypy)
        run: mypy .

      - name: Migration drift check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Unit tests (pytest)
        run: pytest

  frontend:
    name: Workflow builder (React Flow SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        # `npm ci` fails closed if package-lock.json and package.json disagree.
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Unit + e2e tests (vitest)
        run: npm test

      - name: Production build (vite)
        run: npm run build

  production-images:
    name: Immutable application + static images
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    env:
      STATIC_RELEASE_ID: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            --file deploy/Dockerfile \
            --target application \
            --build-arg STATIC_RELEASE_ID="${STATIC_RELEASE_ID}" \
            --tag agenthub-application:ci \
            .

      - name: Build fail-closed static image
        run: |
          docker build \
            --file deploy/Dockerfile \
            --target static-runtime \
            --build-arg STATIC_RELEASE_ID="${STATIC_RELEASE_ID}" \
            --tag agenthub-static:ci \
            .

      - name: Verify non-root read-only static runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect agenthub-static:ci --format '{{.Config.User}}')" = "101"
          test "$(docker image inspect agenthub-static:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "${STATIC_RELEASE_ID}"
          docker run --detach --rm \
            --name agenthub-static-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 18080:8080 \
            agenthub-static:ci
          trap 'docker rm --force agenthub-static-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [ "${attempt}" = "30" ]; then
              docker logs agenthub-static-ci
              exit 1
            fi
            sleep 1
          done

          static_base="http://127.0.0.1:18080/static/${STATIC_RELEASE_ID}"
          curl --fail --silent --show-error \
            --output /dev/null \
            --header 'Accept-Encoding: identity' \
            --write-out '%{content_type}\n' \
            "${static_base}/builder/builder.js" | grep -Fx 'application/javascript'
          curl --fail --silent --show-error \
            --output /dev/null \
            --write-out '%{content_type}\n' \
            "${static_base}/builder/builder.css" | grep -Fx 'text/css'
          curl --fail --silent --show-error \
            "${static_base}/asset-manifest.json" \
            | grep -F "\"release_id\": \"${STATIC_RELEASE_ID}\""
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --path-as-is "${static_base}/../.env")" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "${static_base}/builder/builder.js")" = "403"

      - name: Verify production settings and runtime package
        run: |
          set -euo pipefail
          test "$(docker image inspect agenthub-application:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "${STATIC_RELEASE_ID}"
          test "$(docker image inspect agenthub-application:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^AGENTHUB_IMAGE_RELEASE_ID=' \
            | cut -d= -f2-)" = "${STATIC_RELEASE_ID}"
          common_env=(
            --env DJANGO_SETTINGS_MODULE=config.settings.production
            --env DJANGO_SECRET_KEY=ci-only-production-settings-secret
            --env DJANGO_ALLOWED_HOSTS=agenthub.example.invalid
            --env AGENTHUB_STATIC_RELEASE_ID="${STATIC_RELEASE_ID}"
          )
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            "${common_env[@]}" \
            --env DJANGO_STATIC_URL="/static/${STATIC_RELEASE_ID}/" \
            agenthub-application:ci \
            python manage.py check

          if docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            "${common_env[@]}" \
            --env DJANGO_STATIC_URL=/static/wrong-release/ \
            agenthub-application:ci \
            python -c 'import django; django.setup()'; then
            echo "mismatched application/static release unexpectedly started" >&2
            exit 1
          fi

          if docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            "${common_env[@]}" \
            --env AGENTHUB_IMAGE_RELEASE_ID=wrong-image \
            --env DJANGO_STATIC_URL="/static/${STATIC_RELEASE_ID}/" \
            agenthub-application:ci \
            python -c 'import django; django.setup()'; then
            echo "mismatched application image/static release unexpectedly started" >&2
            exit 1
          fi
