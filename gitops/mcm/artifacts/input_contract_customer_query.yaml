api_version: agenthub/v3
kind: InputContract
metadata:
  organization: mcm
  logical_id: customer_query
spec:
  type: object
  required: [query]
  additionalProperties: false
  properties:
    query: {type: string, minLength: 1, maxLength: 8000}
    conversation_id: {type: string, maxLength: 128}
    locale: {type: string, maxLength: 16}
