{% extends "console/base.html" %}
{% block title %}{{ title }} · AgentHub Console{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Oluştur</button>
    <a class="button secondary" href="{{ navigation_url }}">Vazgeç</a>
  </form>
</div>
{% endblock %}
